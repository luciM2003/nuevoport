# GitHub Pages publica la rama main tal cual está (Settings > Pages > Deploy from a branch).
# Este flujo no despliega: comprueba que lo versionado sea lo que genera el código
# y que no haya enlaces rotos, imágenes sin alternativa ni idiomas desparejos.
name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
